environment:
  episode_days: 30
  initial_capital: 10000.0
  max_leverage: 3.0
  fee_rate: 0.0006
  slippage_rate: 0.0002
  funding_interval_candles: 96  # 8h in 5m candles
  funding_rate: 0.0001

ppo:
  policy: MlpPolicy
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  total_timesteps: 1000000

targets:
  sharpe_min: 1.5
  max_drawdown_max: 0.15
